# =============================================================================
# Gridaflex — Zensical documentation site
# Build:  zensical build   (→ site/)
# Serve:  zensical serve
# =============================================================================

[project]
site_name = "Gridaflex"
site_description = "Gridaflex — système de mise en page flexbox à axes X/Y, sur un moteur gap sans marges négatives."
site_author = "4SH"
# ⚠️ Adaptez site_url à votre dépôt GitHub Pages :
site_url = "https://robinlopez.github.io/gridaflex/"

copyright = """
Gridaflex : API & classes inspirées de Foundation XY, moteur modernisé. Licence MIT.
"""

nav = [
  { "Accueil" = "index.md" },
  { "Démarrage" = "demarrage.md" },
  { "La grille" = "grille.md" },
  { "Gouttières & axes" = "gouttieres.md" },
  { "Alignement & ordre" = "alignement.md" },
  { "Breakpoints & responsive" = "responsive.md" },
  { "Visibilité" = "visibilite.md" },
  { "Constructeur de grille" = "builder.md" },
  { "Modèles de layout" = "layouts.md" },
  { "API & classes" = "api-sass.md" },
  { "Assistant IA" = "assistant-ia.md" },
  { "Migration" = "migration.md" },
  { "Releases" = "releases.md" },
]

extra_css = ["assets/gridaflex.css", "stylesheets/extra.css"]
extra_javascript = ["javascripts/builder.js"]

[project.theme]
language = "fr"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/grid-3x3"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Passer en mode sombre"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Passer en mode clair"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/robinlopez/gridaflex"

# --- Versioning (mike) -------------------------------------------------------
# Permet le déploiement multi-version via `mike deploy`.
# Le sélecteur de version apparaît automatiquement dans le header.
[project.extra.version]
provider = "mike"
default = ["stable"]

# --- Markdown extensions -----------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
